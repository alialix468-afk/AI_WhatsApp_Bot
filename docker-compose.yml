version: '3.8'

services:
  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - whatsapp_service
      - db

  whatsapp_service:
    build:
      context: ./whatsapp_service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./whatsapp_service:/app
      - ./whatsapp_service/auth_info_baileys:/app/auth_info_baileys
    env_file:
      - ./whatsapp_service/.env
    depends_on:
      - fastapi_app

  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

volumes:
  postgres_data:
